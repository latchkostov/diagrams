name: E2E shard
description: >-
  Sets up pnpm, Node and Chromium, builds what the suite serves, and runs one shard of the Playwright suite
  (whole spec files, balanced by scripts/e2e-shard.mjs). Shared by ci.yml and nightly.yml so both test the
  same environment. Check out the repository first.
inputs:
  target:
    description: '"build" (the production e2e build with test hooks) or "dev" (the Vite dev server).'
    default: build
  shard:
    description: This shard's number, one-based.
    required: true
  total:
    description: The number of shards.
    required: true
  retries:
    description: Playwright --retries. Empty keeps the config's (2 on CI).
    default: ""
  repeat-each:
    description: Playwright --repeat-each.
    default: "1"
  blob-name:
    description: >-
      The blob report's file name, unique per job: without --shard every blob would be report.zip, and a
      merge would keep only one.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
    - uses: ./.github/actions/chromium-cache
    # The builds the servers use run while apt installs Chromium's system libraries: the production build
    # (the subpath project, every target) and, for the build target, the e2e build with test hooks.
    - name: System deps and builds
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
      run: |
        case "$TARGET" in build|dev) ;; *) echo "::error::target must be build or dev, got $TARGET"; exit 1 ;; esac
        # The self-hosting builds only where this shard runs their specs (E2E_SELF_HOST, playwright.config.ts).
        list=" $(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL" 2>/dev/null) "
        self_host=""
        case "$list" in *" tests/e2e/self-host.spec.ts "*) self_host="internal" ;; esac
        case "$list" in *" tests/e2e/self-host-locked.spec.ts "*) self_host="${self_host:+$self_host,}locked" ;; esac
        echo "E2E_SELF_HOST=$self_host" >> "$GITHUB_ENV"
        echo "Self-hosting builds for this shard: ${self_host:-none}"
        e2e=""
        if [ "$TARGET" = "build" ]; then
          node scripts/e2e-build.mjs e2e > "$RUNNER_TEMP/e2e-build.log" 2>&1 &
          e2e=$!
        fi
        node scripts/e2e-build.mjs preview > "$RUNNER_TEMP/prod-build.log" 2>&1 &
        prod=$!
        # The self-hosting builds this shard needs (scripts/e2e-profiles.mjs).
        internal=""
        locked=""
        case ",$self_host," in *,internal,*)
          node scripts/e2e-build.mjs internal > "$RUNNER_TEMP/internal-build.log" 2>&1 &
          internal=$! ;;
        esac
        case ",$self_host," in *,locked,*)
          node scripts/e2e-build.mjs locked > "$RUNNER_TEMP/locked-build.log" 2>&1 &
          locked=$! ;;
        esac
        pnpm exec playwright install-deps chromium
        status=0
        if [ -n "$e2e" ]; then
          wait "$e2e" || { echo "::error::e2e build failed"; cat "$RUNNER_TEMP/e2e-build.log"; status=1; }
        fi
        wait "$prod" || { echo "::error::production build failed"; cat "$RUNNER_TEMP/prod-build.log"; status=1; }
        if [ -n "$internal" ]; then
          wait "$internal" || { echo "::error::internal build failed"; cat "$RUNNER_TEMP/internal-build.log"; status=1; }
        fi
        if [ -n "$locked" ]; then
          wait "$locked" || { echo "::error::locked build failed"; cat "$RUNNER_TEMP/locked-build.log"; status=1; }
        fi
        exit "$status"
    - name: Playwright
      shell: bash
      env:
        E2E_TARGET: ${{ inputs.target }}
        # Serve the builds made above instead of building inside Playwright.
        E2E_PREBUILT: "1"
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
        RETRIES: ${{ inputs.retries }}
        REPEAT: ${{ inputs.repeat-each }}
        PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ inputs.blob-name }}
      run: |
        list="$(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL")"
        read -ra specs <<< "$list"
        args=(--repeat-each="$REPEAT")
        if [ -n "$RETRIES" ]; then args+=(--retries="$RETRIES"); fi
        echo "Spec files: ${specs[*]}"
        pnpm exec playwright test "${args[@]}" "${specs[@]}"
