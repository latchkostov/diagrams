name: E2E shard
description: >-
  Sets up pnpm and Node, restores shared builds (or builds locally for Nightly), and runs one shard
  of whole spec files balanced by scripts/e2e-shard.mjs. Check out the repository first.
inputs:
  target:
    description: '"build" (the production e2e build with test hooks) or "dev" (the Vite dev server).'
    default: build
  builds-artifact:
    description: Same-run artifact containing the prebuilt dist directories. Empty builds locally.
    default: ""
  browser-setup:
    description: '"install" provisions Chromium; "image" uses the matching Playwright job container.'
    default: install
  shard:
    description: This shard's number, one-based.
    required: true
  total:
    description: The number of shards.
    required: true
  retries:
    description: Playwright --retries. Empty keeps the config's zero-retry default.
    default: ""
  repeat-each:
    description: Playwright --repeat-each.
    default: "1"
  blob-name:
    description: A unique blob report file name per job, since these shards do not use --shard.
    required: true
runs:
  using: composite
  steps:
    - uses: ./.github/actions/toolchain
    - name: Select shard and self-hosting variants
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
        BROWSER_SETUP: ${{ inputs.browser-setup }}
      run: |
        case "$TARGET" in build|dev) ;; *) echo "::error::target must be build or dev, got $TARGET"; exit 1 ;; esac
        case "$BROWSER_SETUP" in install|image) ;; *) echo "::error::unknown browser setup $BROWSER_SETUP"; exit 1 ;; esac
        list=" $(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL") "
        self_host=""
        case "$list" in *" tests/e2e/self-host.spec.ts "*) self_host="internal" ;; esac
        case "$list" in *" tests/e2e/self-host-locked.spec.ts "*) self_host="${self_host:+$self_host,}locked" ;; esac
        echo "E2E_SELF_HOST=$self_host" >> "$GITHUB_ENV"
        echo "Self-hosting variants for this shard: ${self_host:-none}"
    - uses: ./.github/actions/chromium-cache
      if: inputs.browser-setup == 'install'
    - name: Download shared E2E builds
      if: inputs.builds-artifact != ''
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.builds-artifact }}
        path: tests/.output
    # Nightly keeps its dev/build target and per-shard self-host build selection.
    - name: Local builds
      if: inputs.builds-artifact == ''
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        BROWSER_SETUP: ${{ inputs.browser-setup }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
      run: |
        list="$(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL")"
        read -ra specs <<< "$list"
        node scripts/ci/e2e-builds.mjs build "$TARGET" "${specs[@]}" > "$RUNNER_TEMP/e2e-builds.log" 2>&1 &
        builds=$!
        if [ "$BROWSER_SETUP" = "install" ]; then pnpm exec playwright install-deps chromium; fi
        status=0
        wait "$builds" || { echo "::error::E2E builds failed"; cat "$RUNNER_TEMP/e2e-builds.log"; status=1; }
        exit "$status"
    - name: Browser system dependencies
      if: inputs.browser-setup == 'install' && inputs.builds-artifact != ''
      shell: bash
      run: pnpm exec playwright install-deps chromium
    - name: Report Greek fallback fonts
      if: runner.os == 'Linux'
      shell: bash
      run: |
        fc-match 'system-ui:lang=el'
        fc-match 'sans-serif:lang=el'
        fc-list :lang=el family | sort -u
    - name: Verify served builds
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
      run: |
        list="$(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL")"
        read -ra specs <<< "$list"
        node scripts/ci/e2e-builds.mjs check "$TARGET" "${specs[@]}"
    - name: Playwright
      shell: bash
      env:
        E2E_TARGET: ${{ inputs.target }}
        E2E_PREBUILT: "1"
        E2E_GATE: "1"
        E2E_PORT: "6400"
        E2E_DEV_PORT: "6401"
        E2E_PREVIEW_PORT: "6402"
        E2E_INTERNAL_PORT: "6403"
        E2E_LOCKED_PORT: "6404"
        SHARD: ${{ inputs.shard }}
        TOTAL: ${{ inputs.total }}
        RETRIES: ${{ inputs.retries }}
        REPEAT: ${{ inputs.repeat-each }}
        PLAYWRIGHT_BLOB_OUTPUT_NAME: ${{ inputs.blob-name }}
      run: |
        list="$(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL")"
        read -ra specs <<< "$list"
        args=(--repeat-each="$REPEAT")
        if [ -n "$RETRIES" ]; then args+=(--retries="$RETRIES"); fi
        echo "Spec files: ${specs[*]}"
        pnpm exec playwright test "${args[@]}" "${specs[@]}"
