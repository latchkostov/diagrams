name: Nightly
# The checks a pull request run skips for speed: the whole e2e suite on the Vite dev server (with the
# dev-only project), and the production-build suite three times over with no retries, to surface flakes.
# A failure opens (or updates) the one open issue labelled `nightly-failure`.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"

jobs:
  slowmo-teardown-diagnostic:
    name: Windows slow-motion teardown evidence (report only)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      NIGHTLY_SLOWMO_DIAGNOSTIC: "1"
      DEBUG: pw:browser
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/chromium-cache
      - name: Four quarantined cases, three repetitions, zero retries
        timeout-minutes: 15
        run: pnpm gate quick tests/e2e/slowmo.spec.ts --no-docker --only e2e --repeat 3 --workers 3 --ports 6980 --max-wait 1
      - name: Upload traces, browser logs and synchronous teardown probes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-slowmo-teardown-evidence
          path: tests/.output/g
          retention-days: 14

  properties:
    name: Random property tests (20x runs)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - name: Explore new seeds; failures print seed and shrink path
        shell: bash
        env:
          FC_SEED: random
          FC_RUN_MULTIPLIER: "20"
        run: |
          mapfile -t files < <(git grep -l 'from "fast-check"' -- 'src/**/*.test.ts' 'src/**/*.test.tsx')
          test "${#files[@]}" -gt 0
          mkdir -p tests/.output
          pnpm exec vitest run "${files[@]}" --reporter=default --reporter=json --outputFile=tests/.output/property-results.json
      - name: Upload randomized property failures, seeds and shrink paths
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-properties
          path: tests/.output/property-results.json
          retention-days: 14

  native-unit:
    name: Native unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/chromium-cache
      - name: Native unit tests
        timeout-minutes: 15
        run: pnpm gate full --no-docker --only unit
      - name: Collect native counts or interruption marker
        if: always()
        run: node scripts/e2e-failures.mjs --collect-native tests/.output/g tests/.output/native-results.json
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-native-unit-${{ matrix.os }}
          path: tests/.output/g
          retention-days: 14
      - name: Upload native counts for the failure issue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-native-unit-${{ matrix.os }}
          path: tests/.output/native-results.json
          retention-days: 14

  native-e2e:
    name: Native E2E (${{ matrix.os }}) ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # The interrupted runs project to ~59 minutes on Windows (3 auto workers)
          # and ~75 on macOS (1). Six/eight balanced shards target ~10 minutes of
          # tests each; a 25-minute step and 35-minute job leave setup/upload margin.
          - { os: windows-latest, shard: 1, total: 6 }
          - { os: windows-latest, shard: 2, total: 6 }
          - { os: windows-latest, shard: 3, total: 6 }
          - { os: windows-latest, shard: 4, total: 6 }
          - { os: windows-latest, shard: 5, total: 6 }
          - { os: windows-latest, shard: 6, total: 6 }
          - { os: macos-latest, shard: 1, total: 8 }
          - { os: macos-latest, shard: 2, total: 8 }
          - { os: macos-latest, shard: 3, total: 8 }
          - { os: macos-latest, shard: 4, total: 8 }
          - { os: macos-latest, shard: 5, total: 8 }
          - { os: macos-latest, shard: 6, total: 8 }
          - { os: macos-latest, shard: 7, total: 8 }
          - { os: macos-latest, shard: 8, total: 8 }
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/chromium-cache
      - name: Native production E2E shard, auto workers, no retries
        timeout-minutes: 25
        run: pnpm gate full --no-docker --only e2e --shard ${{ matrix.shard }}/${{ matrix.total }}
      - name: Collect native counts or interruption marker
        if: always()
        run: node scripts/e2e-failures.mjs --collect-native tests/.output/g tests/.output/native-results.json
      - name: Upload native reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-native-e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: tests/.output/g
          retention-days: 14
      - name: Upload native counts for the failure issue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-native-e2e-${{ matrix.os }}-${{ matrix.shard }}
          path: tests/.output/native-results.json
          retention-days: 14

  resource-invariants:
    name: A1 + A3 resource invariants (5000 seeds each) ${{ matrix.shard }}/4
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: pnpm exec vitest run src/sim/autoscaling.invariants.test.ts
        env:
          A1_FUZZ_NIGHTLY: "1"
          RESOURCE_FUZZ_SHARD: ${{ matrix.shard }}/4

  e2e:
    name: ${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev server: every project (chromium, dev, subpath) once. E2E_TARGET=dev serves both the
          # chromium and dev projects from `pnpm dev`; subpath still needs the production build, which
          # the action makes. Tests that read the e2e build skip (lazy-examples.spec.ts).
          - { suite: dev, label: Dev server, target: dev, repeat: 1, shard: 1, total: 4 }
          - { suite: dev, label: Dev server, target: dev, repeat: 1, shard: 2, total: 4 }
          - { suite: dev, label: Dev server, target: dev, repeat: 1, shard: 3, total: 4 }
          - { suite: dev, label: Dev server, target: dev, repeat: 1, shard: 4, total: 4 }
          # Production build (as on pull requests), each test three times.
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 1, total: 6 }
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 2, total: 6 }
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 3, total: 6 }
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 4, total: 6 }
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 5, total: 6 }
          - { suite: repeat, label: "Build ×3", target: build, repeat: 3, shard: 6, total: 6 }
    steps:
      - uses: actions/checkout@v7
      # The same setup, builds and shard run as pull requests (ci.yml), with no retries: a test that fails
      # once out of its runs is a flake to fix.
      - name: Playwright shard
        uses: ./.github/actions/e2e
        with:
          target: ${{ matrix.target }}
          shard: ${{ matrix.shard }}
          total: ${{ matrix.total }}
          retries: "0"
          repeat-each: ${{ matrix.repeat }}
          blob-name: report-${{ matrix.suite }}-${{ matrix.shard }}.zip
      - name: Durations
        if: ${{ !cancelled() }}
        run: node scripts/e2e-durations.mjs tests/.output/results.json 15 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: tests/.output/results.json
          retention-days: 14
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-output-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            tests/.output/report
            tests/.output/results
          retention-days: 14

  # Informational, never a failure: whether the agent skill's committed viewer (what Claude Code's marketplace
  # installs) still matches a fresh build. Stale shows as a warning on the run and a line in its summary; refresh
  # it with `pnpm skill:release` when users should get the latest viewer.
  skill-viewer:
    name: Skill viewer freshness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: pnpm skill:check

  # Opens the `nightly-failure` issue, or updates the open one (its body is the latest failure, and a
  # comment notifies its subscribers), listing the failed tests and linking the run.
  report:
    name: Report failure
    needs: [e2e, native-unit, native-e2e, properties]
    if: >-
      always() && (needs.e2e.result == 'failure' || needs.native-unit.result == 'failure' ||
      needs.native-e2e.result == 'failure' || needs.native-unit.result == 'cancelled' ||
      needs.native-e2e.result == 'cancelled' || needs.properties.result == 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-results-*
          path: results
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          for f in results/nightly-results-properties/property-results.json; do
            [ -f "$f" ] && args+=("Random property tests: new seeds, 20x runs=$f")
          done
          for f in results/nightly-results-dev-*/results.json; do
            [ -f "$f" ] && args+=("Dev server: every project, once=$f")
          done
          for f in results/nightly-results-repeat-*/results.json; do
            [ -f "$f" ] && args+=("Production build: each test three times=$f")
          done
          for f in results/nightly-results-native-*/native-results.json; do
            label="$(basename "$(dirname "$f")")"
            [ -f "$f" ] && args+=("${label#nightly-results-}=$f")
          done
          failures="$(node scripts/e2e-failures.mjs "${args[@]}")"
          {
            echo "The nightly run failed on ${GITHUB_SHA:0:7}: $RUN_URL"
            echo
            if [ -n "$failures" ]; then
              echo "$failures"
            else
              echo "No test failed in the recorded results: a job failed outside the tests. See the run."
            fi
            echo
            echo "Each test ran once on the dev server and three times on the production build, with no retries."
            echo "Native Windows/macOS run unit tests separately and every production E2E project once across 6/8 shards, with auto workers and no retries. Interrupted counts are partial."
            echo "Random property tests explore new seeds with FC_RUN_MULTIPLIER=20; replay the failing test with its reported FC_SEED and FC_PATH."
            echo "Fix the cause; this issue stays open until someone closes it."
          } > body.md
          # An issue body holds at most 65,536 characters.
          head -c 60000 body.md > issue.md
          gh label create nightly-failure --color B60205 --description "A nightly check failed" 2> /dev/null || true
          number="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Nightly run failed" --label nightly-failure --body-file issue.md
          fi
