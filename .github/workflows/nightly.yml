name: Nightly
# The checks a pull request run skips for speed: the whole e2e suite on the Vite dev server (with the
# dev-only project), and the production-build suite three times over with no retries, to surface flakes.
# A failure opens (or updates) the one open issue labelled `nightly-failure`.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "true"
  # Serve the builds made in "System deps and builds" instead of building inside Playwright.
  E2E_PREBUILT: "1"

jobs:
  e2e:
    name: ${{ matrix.label }} ${{ matrix.shard }}/${{ matrix.total }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Dev server: every project (chromium, dev, subpath) once. E2E_TARGET=dev serves both the
          # chromium and dev projects from `pnpm dev`; subpath still needs the production build.
          - { suite: dev, label: Dev server, shard: 1, total: 4 }
          - { suite: dev, label: Dev server, shard: 2, total: 4 }
          - { suite: dev, label: Dev server, shard: 3, total: 4 }
          - { suite: dev, label: Dev server, shard: 4, total: 4 }
          # Production build (as on pull requests), each test three times.
          - { suite: repeat, label: Build ×3, shard: 1, total: 6 }
          - { suite: repeat, label: Build ×3, shard: 2, total: 6 }
          - { suite: repeat, label: Build ×3, shard: 3, total: 6 }
          - { suite: repeat, label: Build ×3, shard: 4, total: 6 }
          - { suite: repeat, label: Build ×3, shard: 5, total: 6 }
          - { suite: repeat, label: Build ×3, shard: 6, total: 6 }
    env:
      E2E_TARGET: ${{ matrix.suite == 'dev' && 'dev' || 'build' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: System deps and builds
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          pids=()
          if [ "$E2E_TARGET" = "build" ]; then
            VITE_E2E=1 pnpm exec vite build --outDir tests/.output/e2e-dist --emptyOutDir --logLevel error > "$RUNNER_TEMP/e2e-build.log" 2>&1 &
            pids+=("$!")
          fi
          VITE_E2E='' pnpm exec vite build --outDir tests/.output/preview-dist --emptyOutDir --logLevel error > "$RUNNER_TEMP/prod-build.log" 2>&1 &
          pids+=("$!")
          if [ "$CACHE_HIT" = "true" ]; then pnpm exec playwright install-deps chromium; fi
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          if [ "$status" != 0 ]; then
            echo "::error::a build failed"
            cat "$RUNNER_TEMP"/*-build.log
          fi
          exit "$status"
      # No retries: a test that fails once out of its runs is a flake to fix.
      - name: Playwright
        env:
          SUITE: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.suite }}-${{ matrix.shard }}.zip
        run: |
          list="$(node scripts/e2e-shard.mjs "$SHARD" "$TOTAL")"
          read -ra specs <<< "$list"
          repeat=1
          if [ "$SUITE" = "repeat" ]; then repeat=3; fi
          pnpm exec playwright test --retries=0 --repeat-each="$repeat" "${specs[@]}"
      - name: Durations
        if: ${{ !cancelled() }}
        run: node scripts/e2e-durations.mjs tests/.output/results.json 15 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results-${{ matrix.suite }}-${{ matrix.shard }}
          path: tests/.output/results.json
          retention-days: 14
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-output-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            tests/.output/report
            tests/.output/results
          retention-days: 14

  # Opens the `nightly-failure` issue, or updates the open one (its body is the latest failure, and a
  # comment notifies its subscribers), listing the failed tests and linking the run.
  report:
    name: Report failure
    needs: e2e
    if: failure() && needs.e2e.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: nightly-results-*
          path: results
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          for f in results/nightly-results-dev-*/results.json; do
            [ -f "$f" ] && args+=("Dev server: every project, once=$f")
          done
          for f in results/nightly-results-repeat-*/results.json; do
            [ -f "$f" ] && args+=("Production build: each test three times=$f")
          done
          failures="$(node scripts/e2e-failures.mjs "${args[@]}")"
          {
            echo "The nightly e2e run failed on ${GITHUB_SHA:0:7}: $RUN_URL"
            echo
            if [ -n "$failures" ]; then
              echo "$failures"
            else
              echo "No test failed in the recorded results: a job failed outside the tests. See the run."
            fi
            echo
            echo "Each test ran once on the dev server and three times on the production build, with no retries."
            echo "Fix the cause; this issue stays open until someone closes it."
          } > body.md
          # An issue body holds at most 65,536 characters.
          head -c 60000 body.md > issue.md
          gh label create nightly-failure --color B60205 --description "The nightly e2e run failed" 2> /dev/null || true
          number="$(gh issue list --label nightly-failure --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "Nightly e2e run failed" --label nightly-failure --body-file issue.md
          fi
