name: CI
on:
  push:
    branches: [master, "ci/**"]
  pull_request:

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub sets CI=true already; explicit because the suites depend on it (Playwright workers and
  # E2E_TARGET=build, Vitest timeouts).
  CI: "true"

jobs:
  # Decides whether the e2e matrix has anything to prove. This runs instead of a `paths-ignore` trigger:
  # skipping the workflow would leave the `CI` gate check pending on a docs-only pull request.
  changes:
    name: Detect changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
      tree: ${{ steps.filter.outputs.tree }}
    steps:
      - name: Classify changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          # Prose and licence text can't break the app; the checks job (lint, format) still runs on them.
          docs_only() {
            local file any=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              any=true
              case "$file" in
                docs/*|*.md|LICENSE) ;;
                *) return 1 ;;
              esac
            done <<< "$1"
            [ "$any" = true ]
          }

          if [ "$EVENT" = "push" ]; then
            # A squash-merged pull request whose CI ran against the current master lands exactly the tree
            # that run tested, and the `CI` gate records every tree it passes as a `ci-tested-tree-<tree>`
            # artifact. Only a marker from this workflow's own pull_request run on a branch of this
            # repository counts (a fork can upload an artifact under any name). The tree pins ci.yml too.
            # If master moved in between, the tree is new and the matrix runs.
            if [ -n "$HEAD_TREE" ] && run_id="$(gh api \
                "repos/$REPO/actions/artifacts?name=ci-tested-tree-$HEAD_TREE" \
                --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == $REPO_ID)][0].workflow_run.id // empty")" \
              && [ -n "$run_id" ] \
              && [ "$(gh api "repos/$REPO/actions/runs/$run_id" --jq '"\(.event) \(.path) \(.conclusion)"')" \
                = "pull_request .github/workflows/ci.yml success" ]; then
              echo "Tree $HEAD_TREE already passed CI in run $run_id; skipping the e2e matrix."
              echo "e2e=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            files=""
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              files="$(gh api "repos/$REPO/compare/$BEFORE_SHA...$GITHUB_SHA" --jq '.files[].filename' || true)"
            fi
          else
            # The tree this run tests (the PR merged into master); the gate records it for the push above.
            tree="$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq '.tree.sha' || true)"
            [[ "$tree" =~ ^[0-9a-f]{40}$ ]] && echo "tree=$tree" >> "$GITHUB_OUTPUT"
            files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' || true)"
          fi

          echo "Changed files:"
          echo "${files:-(unknown)}"
          if [ -n "$files" ] && docs_only "$files"; then
            echo "Docs only: skipping the e2e matrix."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          fi

  # Runs on every event (docs-only and already-tested trees included) and beside the e2e matrix.
  checks:
    name: Types, lint, unit, build
    runs-on: ubuntu-26.04
    # Unit tests with coverage take 7–13 minutes on hosted runners; 15 left no headroom.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      # `pnpm build` fails if a dev-only test hook or a private example ships (vite.config.ts guards).
      - run: pnpm build
      - name: Entry chunk size budget
        run: pnpm size

  # Output parity (docs/PARITY.md): everything the app produces from a diagram (simulations, checks, exports,
  # imports, agent tools, layout, languages, and on a production build the canvas, images and Interactive HTML)
  # against the committed goldens. Fails on any difference, with the diff in the log and the job summary. Never
  # updates goldens (`pnpm parity:update` refuses on CI). Runs on every event: the skill's references are Markdown,
  # so a docs-only change can still move a golden.
  parity:
    name: Output parity
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - name: Type-check the harness
        run: pnpm exec tsc --noEmit -p tests/parity
      # The Node tier runs here; the browser tier in Playwright's Linux image for the installed version, through
      # Docker (scripts/parity.mjs), exactly as it runs on a laptop, so goldens recorded anywhere match.
      - name: Parity
        run: pnpm parity
      - name: Upload actual outputs and diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: parity-output
          path: |
            tests/.output/parity
            tests/.output/parity-results
          retention-days: 14

  e2e:
    name: E2E ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-26.04
    # Some runners spend ~8 minutes on the parallel builds and browser setup before tests start; 15 left no headroom.
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      # Setup, builds and the run, shared with the nightly workflow. Each shard runs whole spec files,
      # picked to even out the measured durations (scripts/e2e-shard.mjs).
      - name: Playwright shard
        uses: ./.github/actions/e2e
        with:
          shard: ${{ matrix.shard }}
          total: ${{ strategy.job-total }}
          blob-name: report-${{ matrix.shard }}.zip
      - name: Durations
        if: ${{ !cancelled() }}
        run: node scripts/e2e-durations.mjs tests/.output/results.json 15 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durations
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-durations-${{ matrix.shard }}
          path: tests/.output/results.json
          retention-days: 30
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/.output/blob
          retention-days: 3
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-output-${{ matrix.shard }}
          path: |
            tests/.output/report
            tests/.output/results
          retention-days: 14

  e2e-report:
    name: Merged E2E report
    needs: e2e
    # Only when a shard failed: one HTML report with every shard's failures and traces.
    if: failure() && needs.e2e.result == 'failure'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: tests/.output/all-blob-reports
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html tests/.output/all-blob-reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/.output/merged-report
          PLAYWRIGHT_HTML_OPEN: never
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report-merged
          path: tests/.output/merged-report
          retention-days: 14

  # The one check to require for merging: passes when every job that had to run passed, and an e2e matrix
  # that `changes` skipped (docs only, or a tree a pull request run already passed) counts as passed.
  self-host:
    name: Self-host image and chart
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/toolchain
      - uses: ./.github/actions/chromium-cache
      - name: Install system dependencies for container smoke test
        run: pnpm exec playwright install-deps chromium
      - name: Static image smoke
        run: pnpm self-host:smoke --static-only
      - name: Collaboration server image smoke (read-only, headers, browsers, logs and size)
        run: pnpm self-host:smoke --server-only
      - uses: azure/setup-helm@v5.0.1
      - run: helm lint deploy/self-host/helm
      - run: helm template diagrams deploy/self-host/helm --set ingress.enabled=true --set ingress.tls.enabled=true
      - run: helm lint deploy/self-host/helm --set mode=server
      - run: helm template diagrams deploy/self-host/helm --set mode=server --set replicas=3 --set ingress.enabled=true --set ingress.tls.enabled=true
      - name: Assert both chart modes
        run: node scripts/self-host-chart-test.mjs

  ci:
    name: CI
    needs: [changes, checks, parity, e2e, self-host]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECKS: ${{ needs.checks.result }}
          SELF_HOST: ${{ needs.self-host.result }}
          PARITY: ${{ needs.parity.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_WANTED: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes=$CHANGES checks=$CHECKS self-host=$SELF_HOST parity=$PARITY e2e=$E2E (wanted: $E2E_WANTED)"
          [ "$CHANGES" = "success" ] || { echo "::error::change detection $CHANGES"; exit 1; }
          [ "$CHECKS" = "success" ] || { echo "::error::checks $CHECKS"; exit 1; }
          [ "$SELF_HOST" = "success" ] || { echo "::error::self-host $SELF_HOST"; exit 1; }
          [ "$PARITY" = "success" ] || { echo "::error::output parity $PARITY"; exit 1; }
          if [ "$E2E_WANTED" = "true" ]; then
            [ "$E2E" = "success" ] || { echo "::error::e2e $E2E"; exit 1; }
          else
            [ "$E2E" = "skipped" ] || [ "$E2E" = "success" ] || { echo "::error::e2e $E2E"; exit 1; }
          fi
          echo "All required jobs passed."
      # Only reached when the gate passed. The push that lands this tree on master finds the artifact by
      # name and skips the e2e matrix (see `changes`).
      - name: Record tested tree
        if: github.event_name == 'pull_request' && needs.changes.outputs.tree != ''
        run: echo "$GITHUB_SHA" > tested-tree.txt
      - name: Upload tested tree marker
        if: github.event_name == 'pull_request' && needs.changes.outputs.tree != ''
        uses: actions/upload-artifact@v7
        with:
          name: ci-tested-tree-${{ needs.changes.outputs.tree }}
          path: tested-tree.txt
          retention-days: 14
          overwrite: true
