<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Signing in · Diagrams</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 14px/1.5 system-ui, sans-serif;
        color: #4b5563;
        background: #f8fafc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #cbd5e1;
          background: #0f172a;
        }
      }
    </style>
  </head>
  <body>
    <p id="msg" data-testid="auth-message">Finishing sign-in…</p>
    <!-- A file, not an inline script, so the Content-Security-Policy keeps script-src to 'self'. -->
    <script src="auth.js"></script>
  </body>
</html>
