apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-diagrams
spec:
  replicas: 2
  selector:
    matchLabels:
      app: live-diagrams
  template:
    metadata:
      labels:
        app: live-diagrams
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: live-diagrams
          # Build and load/push this image into YOUR cluster's registry first.
          image: live-diagrams:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: live-diagrams
spec:
  selector:
    app: live-diagrams
  ports:
    - name: http
      port: 80
      targetPort: http
