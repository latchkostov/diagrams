[build]
command = "pnpm build:internal"
publish = "dist"

[[headers]]
for = "/*"
[headers.values]
"Referrer-Policy" = "strict-origin-when-cross-origin"
"X-Content-Type-Options" = "nosniff"
"Permissions-Policy" = "microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=()"
"Content-Security-Policy" = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"
"Cross-Origin-Opener-Policy" = "same-origin-allow-popups"

[[headers]]
for = "/"
[headers.values]
"Cache-Control" = "no-cache"

[[headers]]
for = "/index.html"
[headers.values]
"Cache-Control" = "no-cache"

[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31536000, immutable"

[[headers]]
for = "/embed/*.js"
[headers.values]
"Access-Control-Allow-Origin" = "*"
"Cross-Origin-Resource-Policy" = "cross-origin"
"Cache-Control" = "public, max-age=3600, stale-while-revalidate=86400"

[[headers]]
for = "/auth.html"
[headers.values]
"Cross-Origin-Opener-Policy" = "unsafe-none"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
