# Generated by pnpm headers:self-host. LD_STATIC=off; LD_BASE=/; LD_ORIGIN=<public origin>.
# Put the map in http {}; put the location alongside the existing static locations in server {}.
map $http_upgrade $live_diagrams_connection {
    default upgrade;
    "" close;
}
location /collab/ {
        # No URI suffix: preserve LD_BASE and the versioned WebSocket path.
        proxy_pass http://diagrams:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $live_diagrams_connection;
        proxy_read_timeout 1h;
    }
