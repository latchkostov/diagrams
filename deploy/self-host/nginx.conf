# Live Diagrams: security headers for a self-hosted copy (docs/SELF-HOSTING.md).
# Generated by scripts/self-host-headers.ts (`pnpm headers:self-host`); regenerate rather than edit.
# Embeds may be framed by: this site only.
# No outside origins: build without the cloud storage variables.

# 1. In the http {} block: the embed policy for any URL with an "embed" parameter (?embed=1), as the app reads it.
map $args $live_diagrams_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
    "~(^|&)embed(=|&|$)" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
}

# 2. In the server {} block that serves the build (dist/). Repeat these lines in any location {} that has its
#    own add_header: nginx drops the inherited ones there.
server {
    # listen, server_name, TLS and your sign-in (auth_request, oauth2-proxy...) as usual.
    root /srv/live-diagrams;
    index index.html;

    add_header Content-Security-Policy $live_diagrams_csp always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}
