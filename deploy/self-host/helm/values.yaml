# static preserves the existing site-only deployment; server uses one in-memory relay.
mode: static
image:
  repository: live-diagrams
  tag: local
  pullPolicy: IfNotPresent
replicas: 2
server:
  # 512 MiB = 128 outbound + 128 Node baseline + 65 inbound
  # (2 * 32 sockets * 1050624 bytes, rounded up) + 32 compression cache
  # + 64 compression work + 95 spare. Keep total buffers <= 25% of the limit.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  image:
    repository: live-diagrams-server
    tag: local
    pullPolicy: IfNotPresent
  # Runtime settings only. LD_BASE follows build.basePath; the listener stays on 8080.
  # Add any documented LD_* setting here. Omit LD_ORIGIN for direct HTTP access.
  env:
    LD_TRUST_PROXY: "0"
    LD_TRUST_PROXY_HOPS: "1"
    LD_ROOM_CAP: "8"
    LD_SOCKET_BUFFER_BYTES: "16777216"
    LD_TOTAL_BUFFER_BYTES: "134217728"
    LD_MAX_SOCKETS: "32"
# Build metadata only: changing these values does NOT rebuild the image or change the app.
# Build a matching image with Docker --build-arg and set image.tag to that version.
build:
  profile: internal
  switches:
    VITE_DISABLE_SHARE_LINKS: "1"
    VITE_DISABLE_LINK_OPEN: "0"
    VITE_DISABLE_AI_TOOLS: "1"
    VITE_DISABLE_ONDEVICE: "0"
    VITE_PRIVATE_BY_DEFAULT: "1"
    VITE_BRAND_NAME: Live Diagrams
    VITE_LOCALES: ""
    # Static image build metadata only. Rooms are independent of share links.
    # VITE_ENABLE_COLLAB=1 aliases VITE_COLLAB=public (public trackers and STUN).
    # A TURN credential is compiled into the page: anyone who can open the site can read it.
    VITE_ENABLE_COLLAB: "0"
    VITE_COLLAB_TRACKERS: ""
    VITE_COLLAB_STUN: ""
    VITE_COLLAB_TURN: ""
    VITE_COLLAB_TURN_USERNAME: ""
    VITE_COLLAB_TURN_CREDENTIAL: ""
  basePath: /
  frameAncestors: ""
resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 128Mi
ingress:
  enabled: false
  className: nginx
  host: diagrams.example.com
  annotations: {}
  # Example: cert-manager.io/cluster-issuer: letsencrypt-production
  tls:
    enabled: false
    secretName: live-diagrams-tls
