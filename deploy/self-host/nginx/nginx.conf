# Generated by pnpm headers:self-host; included inside nginx's http {}.
map $args $live_diagrams_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
    "~(^|&)embed(=|&|$)" "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'";
}
map $uri $live_diagrams_coop {
    default "same-origin-allow-popups";
    ~/auth\.html$ "";
}
map "$status:$uri" $live_diagrams_cache {
    default "no-store";
    ~^(200|206|304):/assets/ "public, max-age=31536000, immutable";
    ~^(200|206|304):.*/embed/[^/]+\.js$ "public, max-age=3600, stale-while-revalidate=86400";
    ~^(200|206|304): "no-cache";
}
map $uri $live_diagrams_cors {
    default "";
    ~/embed/[^/]+\.js$ "*";
}
map $uri $live_diagrams_corp {
    default "";
    ~/embed/[^/]+\.js$ "cross-origin";
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "microphone=(self), display-capture=(self), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Content-Security-Policy "$live_diagrams_csp" always;
    add_header Cross-Origin-Opener-Policy "$live_diagrams_coop" always;
    add_header Cache-Control "$live_diagrams_cache" always;
    add_header Access-Control-Allow-Origin "$live_diagrams_cors" always;
    add_header Cross-Origin-Resource-Policy "$live_diagrams_corp" always;
    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ { try_files $uri =404; }
    location ~ /embed/[^/]+\.js$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
