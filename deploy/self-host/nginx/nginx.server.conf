# Generated by pnpm headers:self-host; included inside nginx's http {}.
# Set LD_ORIGIN to the public origin and LD_BASE=/ on diagrams.
map $http_upgrade $live_diagrams_connection {
    default upgrade;
    "" close;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    location / {
        # No URI suffix: preserve LD_BASE and the versioned WebSocket path.
        proxy_pass http://diagrams:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $live_diagrams_connection;
        proxy_read_timeout 1h;
    }
}
