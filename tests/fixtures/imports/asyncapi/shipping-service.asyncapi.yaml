# Self-written fixture: a second application that shares channels with orders-service.asyncapi.yaml. Importing
# both together should join them on the channel address (orders.placed.v1) into one diagram: Order service ->
# orders.placed.v1 -> Shipping service. Imported alone, the topic has no producer (an import report line).
asyncapi: 3.0.0
info:
  title: Shipping service
  version: 1.0.4
defaultContentType: application/json

servers:
  production:
    host: kafka-0.shop.internal:9092
    protocol: kafka-secure

channels:
  orderPlaced:
    address: orders.placed.v1
    messages:
      OrderPlaced:
        name: OrderPlaced
        contentType: application/vnd.apache.avro
        payload:
          schemaFormat: application/vnd.apache.avro;version=1.9.0
          schema:
            type: record
            name: OrderPlaced
            namespace: shop.orders.v1
            fields:
              - name: orderId
                type: string
  shipmentDispatched:
    address: shipping.dispatched.v1
    messages:
      ShipmentDispatched:
        name: ShipmentDispatched
        payload:
          type: object
          properties:
            orderId:
              type: string
            carrier:
              type: string
  shippingDeadLetter:
    address: shipping.orders-placed.dlq
    description: Orders the shipping service gave up on after its retries.
    messages:
      OrderPlaced:
        $ref: "#/channels/orderPlaced/messages/OrderPlaced"

operations:
  onOrderPlaced:
    action: receive
    channel:
      $ref: "#/channels/orderPlaced"
    bindings:
      kafka:
        groupId:
          type: string
          enum: [shipping-service]
        bindingVersion: 0.5.0
  publishShipmentDispatched:
    action: send
    channel:
      $ref: "#/channels/shipmentDispatched"
  deadLetterOrderPlaced:
    action: send
    channel:
      $ref: "#/channels/shippingDeadLetter"
