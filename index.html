<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diagrams: architecture diagrams for event-driven and distributed systems." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Diagrams</title>
    <!--
      WebMCP origin trial (Chrome 149-156, Edge; ends around 17 Nov 2026). It lets agents call the
      editor's tools (src/ai/webmcp/) in browsers that don't have WebMCP on by default.
      To enable: register https://www.livediagrams.dev at
        Chrome: https://developer.chrome.com/origintrials (trial "WebMCP")
        Edge:   https://developer.microsoft.com/microsoft-edge/origin-trials
      then add one tag per token here (tokens are public; each is bound to the origin and expires):
        <meta http-equiv="origin-trial" content="PASTE_CHROME_TOKEN" />
        <meta http-equiv="origin-trial" content="PASTE_EDGE_TOKEN" />
      Note the expiry date in the commit message, and remove the tags once WebMCP ships (Chrome 157?).
    -->
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem("diagrams.settings.v1") || "{}");
        var t = s.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
