<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Live Diagrams is a free, open-source tool for drawing distributed-systems and event-driven architecture diagrams, then watching messages flow through them. It runs in your browser."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Live Diagrams</title>
    <!-- Link previews. The name matches the OAuth consent screens and the page's own wordmark exactly. -->
    <meta property="og:site_name" content="Live Diagrams" />
    <meta property="og:title" content="Live Diagrams" />
    <meta
      property="og:description"
      content="Draw distributed systems, then watch messages flow through them. Free, open source, in your browser."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.livediagrams.dev/" />
    <meta property="og:image" content="https://www.livediagrams.dev/brand/logo-256.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Live Diagrams" />
    <!--
      WebMCP origin trial (Chrome 149-156, Edge; ends around 17 Nov 2026). It lets agents call the
      editor's tools (src/ai/webmcp/) in browsers that don't have WebMCP on by default.
      To enable: register https://www.livediagrams.dev at
        Chrome: https://developer.chrome.com/origintrials (trial "WebMCP")
        Edge:   https://developer.microsoft.com/microsoft-edge/origin-trials
      then add one tag per token here (tokens are public; each is bound to the origin and expires):
        <meta http-equiv="origin-trial" content="PASTE_CHROME_TOKEN" />
        <meta http-equiv="origin-trial" content="PASTE_EDGE_TOKEN" />
      Note the expiry date in the commit message, and remove the tags once WebMCP ships (Chrome 157?).
    -->
    <!-- Applies the saved theme before first paint (a file, so the CSP needs no inline script). -->
    <script src="/theme.js"></script>
    <style>
      /* The page before the app starts, and without JavaScript: what Live Diagrams is, and the policy links
         (crawlers and OAuth brand reviewers read this). React replaces it on mount. */
      .boot {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 6px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #566074;
        background: #f3f5f8;
      }
      [data-theme="dark"] .boot {
        color: #9ba5b9;
        background: #0e131d;
      }
      [data-embed] .boot {
        visibility: hidden;
      }
      .boot h1 {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 18px;
        color: #131926;
      }
      [data-theme="dark"] .boot h1 {
        color: #e8ecf4;
      }
      .boot p {
        margin: 0;
        max-width: 420px;
      }
      .boot a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot" data-testid="boot">
        <h1><img src="./favicon.svg" alt="" width="24" height="24" />Live Diagrams</h1>
        <p>Draw distributed systems, then watch messages flow through them. Free, open source, in your browser.</p>
        <noscript><p>Live Diagrams needs JavaScript to run.</p></noscript>
        <p><a href="./privacy.html">Privacy</a> · <a href="./terms.html">Terms</a></p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
